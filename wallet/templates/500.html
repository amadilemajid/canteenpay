<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | CanteenPay Uganda</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { max-width: 420px; background: #1e293b; border: 1px solid #7f1d1d; border-radius: 14px; padding: 32px 24px; text-align: center; }
        .code { font-size: 3rem; font-weight: 800; color: #f87171; margin: 0; }
        h1 { font-size: 1.3rem; margin: 8px 0 10px; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
        .actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        a { padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.9rem; }
        .primary { background: #10b981; color: #052e16; }
        .secondary { background: #334155; color: #f8fafc; }
    </style>
</head>
<body>
    <div class="card">
        <p class="code">500</p>
        <h1>Temporary Server Error</h1>
        <p>Something went wrong on our end. Your wallet balance is safe — please refresh or try again in a moment.</p>
        <div class="actions">
            <a class="primary" href="/">Return Home</a>
            <a class="secondary" href="/pos/">Canteen POS</a>
        </div>
    </div>
</body>
</html>

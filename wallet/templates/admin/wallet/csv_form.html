{% extends "admin/base_site.html" %}
{% block content %}
<div style="max-width: 500px; background: #fff; padding: 20px; border-radius: 8px;">
    <h2>Upload Student CSV</h2>
    <p>Prepare a CSV file with headers: <code>student_reg_no,full_name,parent_phone,pin</code></p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="default" style="padding: 10px 18px; cursor: pointer;">Upload & Import</button>
    </form>
</div>
{% endblock %}

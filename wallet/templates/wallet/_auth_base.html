<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CanteenPay | Account{% endblock %}</title>
    <style>
        :root, [data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;
            --border: #334155; --input-bg: #0f172a; --input-txt: #f8fafc;
        }
        [data-theme="light"] {
            --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280;
            --border: #d1d5db; --input-bg: #f9fafb; --input-txt: #111827;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; transition: background 0.2s, color 0.2s;
        }
        .auth-card {
            width: 100%; max-width: 420px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 28px 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        }
        .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .brand-logo { font-size: 1.25rem; font-weight: 800; color: #10b981; }
        .theme-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text);
            border-radius: 8px; padding: 5px 10px; font-size: 0.84rem; cursor: pointer;
        }
        h1 { margin: 0 0 8px; font-size: 1.25rem; }
        p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin: 0 0 16px; }
        label { display: block; font-size: 0.88rem; font-weight: 600; margin: 12px 0 5px; }
        input {
            width: 100%; padding: 11px 12px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--input-bg);
            color: var(--input-txt); font-size: 0.98rem;
        }
        input:focus { outline: 2px solid #10b981; border-color: #10b981; }
        .helptext { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
        .errorlist { list-style: none; padding: 8px 10px; margin: 8px 0; background: #7f1d1d; color: #fecaca; border-radius: 6px; font-size: 0.84rem; }
        .submit-btn {
            width: 100%; padding: 13px; margin-top: 18px;
            background: #10b981; color: #052e16; font-weight: 800;
            border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
        }
        .submit-btn:hover { background: #34d399; }
        .links {
            margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; font-size: 0.84rem; flex-wrap: wrap; gap: 8px;
        }
        .links a { color: #10b981; text-decoration: none; font-weight: 600; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand">
            <div class="brand-logo">💳 CanteenPay Staff</div>
            <button type="button" class="theme-btn" id="themeToggle" onclick="toggleTheme()">☀️ Light</button>
        </div>
        {% block content %}{% endblock %}
    </div>
    <script>
        const THEME_KEY = "canteenpay_theme";
        function applyTheme(dark) {
            document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            document.getElementById("themeToggle").textContent = dark ? "☀️ Light" : "🌙 Dark";
            try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (_) {}
        }
        function toggleTheme() { applyTheme(document.documentElement.getAttribute("data-theme") !== "dark"); }
        (function () {
            let saved = null;
            try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
            applyTheme(saved !== "light");
        })();
    </script>
</body>
</html>

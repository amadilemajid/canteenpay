{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanteenPay | Canteen Scanner POS</title>
    <script src="{% static 'wallet/js/html5-qrcode.min.js' %}"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; margin: 0; padding: 16px; }
        .container { max-width: 460px; margin: 0 auto; background: #1f2937; padding: 20px; border-radius: 12px; }
        h2 { margin-top: 0; text-align: center; color: #10b981; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
        label { display: block; margin: 12px 0 4px; font-size: 0.9rem; color: #d1d5db; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #374151; color: #fff; font-size: 1.1rem; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #10b981; color: #fff; font-weight: 700; border: none; border-radius: 8px; font-size: 1.1rem; margin-top: 16px; cursor: pointer; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .info-card { background: #374151; padding: 12px; border-radius: 8px; margin-top: 12px; display: none; }
        .results { margin-top: 6px; border-radius: 8px; overflow: hidden; }
        .results button { width: 100%; text-align: left; margin: 0; border-radius: 0; background: #374151; font-size: 0.95rem; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid #4b5563; }
        .results button span { display: block; color: #9ca3af; font-size: 0.8rem; font-weight: 500; }
        .alert { padding: 12px; border-radius: 8px; margin-top: 14px; font-weight: 600; text-align: center; display: none; }
        .ok { background: #065f46; color: #a7f3d0; }
        .err { background: #7f1d1d; color: #fecaca; }
        .confirm-banner {
            display: none;
            margin-top: 14px;
            padding: 14px 12px;
            border-radius: 8px;
            background: #fef3c7;
            color: #92400e;
            border: 2px solid #f59e0b;
            font-size: 1.05rem;
            font-weight: 800;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    {% csrf_token %}
    <h2>Canteen QR Checkout</h2>
    <div id="reader"></div>

    <label for="nameSearch">Search by student name</label>
    <input type="text" id="nameSearch" placeholder="Type a name, then tap Full Name — Class" autocomplete="off">
    <div id="searchResults" class="results"></div>

    <label for="scannedId">CanteenPay code (scan the card or type it)</label>
    <input type="text" id="scannedId" placeholder="e.g. YMB-0042" autocomplete="off" autofocus>

    <div id="studentInfo" class="info-card"></div>

    <label for="orderAmount">Purchase Amount (UGX)</label>
    <input type="number" id="orderAmount" placeholder="e.g. 2500" min="100" step="100">

    <label for="itemsNote">Items Bought (Optional)</label>
    <input type="text" id="itemsNote" placeholder="e.g. Chapati + Soda">

    <div id="confirmChargeBanner" class="confirm-banner" role="status" aria-live="polite"></div>

    <label for="studentPin">Student 4-Digit PIN</label>
    <input type="password" id="studentPin" maxlength="4" inputmode="numeric" placeholder="****">

    <button id="chargeBtn" type="button" onclick="processCheckout()">Charge Student Wallet</button>
    <button id="balanceBtn" type="button" onclick="checkBalanceOnly()" style="background:#3b82f6; margin-top:10px;">
        Check Balance Only (Requires PIN)
    </button>
    <div id="alertBox" class="alert"></div>
    <div id="balanceBox" class="alert" style="display:none;"></div>
</div>

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === `${name}=`) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        if (!cookieValue && name === "csrftoken") {
            const tokenInput = document.querySelector("[name=csrfmiddlewaretoken]");
            if (tokenInput) cookieValue = tokenInput.value;
        }
        return cookieValue || "";
    }

    function generateIdempotencyKey() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
            return window.crypto.randomUUID();
        }
        return `pos-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }

    let pendingIdempotencyKey = generateIdempotencyKey();

    function resetCheckoutKey() {
        pendingIdempotencyKey = generateIdempotencyKey();
    }

    function onScanSuccess(decodedText) {
        scannedId.value = decodedText.trim();
        resetCheckoutKey();
        fetchStudentInfo();
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
    html5QrcodeScanner.render(onScanSuccess);

    let searchTimer = null;
    let selectedStudent = { name: "", classStream: "" };
    const nameSearch = document.getElementById("nameSearch");
    const searchResults = document.getElementById("searchResults");
    const scannedId = document.getElementById("scannedId");
    const orderAmount = document.getElementById("orderAmount");
    const confirmChargeBanner = document.getElementById("confirmChargeBanner");

    function updateConfirmChargeBanner() {
        const amountVal = Number(orderAmount.value);
        if (selectedStudent.name && amountVal > 0) {
            const classText = selectedStudent.classStream ? ` (${selectedStudent.classStream})` : "";
            confirmChargeBanner.textContent =
                `Confirm Charge: UGX ${amountVal.toLocaleString()} for ${selectedStudent.name}${classText}`;
            confirmChargeBanner.style.display = "block";
        } else {
            confirmChargeBanner.textContent = "";
            confirmChargeBanner.style.display = "none";
        }
    }

    scannedId.focus();
    scannedId.addEventListener("input", () => {
        resetCheckoutKey();
        selectedStudent = { name: "", classStream: "" };
        updateConfirmChargeBanner();
    });
    orderAmount.addEventListener("input", () => {
        resetCheckoutKey();
        updateConfirmChargeBanner();
    });
    scannedId.addEventListener("change", fetchStudentInfo);
    scannedId.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            fetchStudentInfo();
        }
    });

    nameSearch.addEventListener("input", () => {
        clearTimeout(searchTimer);
        const query = nameSearch.value.trim();
        if (query.length < 2) {
            searchResults.innerHTML = "";
            return;
        }
        searchTimer = setTimeout(() => searchStudents(query), 250);
    });

    async function searchStudents(query) {
        const res = await fetch(`/api/pos/students/search/?q=${encodeURIComponent(query)}`);
        if (!res.ok) {
            searchResults.innerHTML = "";
            return;
        }
        const data = await res.json();
        searchResults.innerHTML = "";
        (data.results || []).forEach((row) => {
            const button = document.createElement("button");
            button.type = "button";
            const title = document.createElement("strong");
            title.textContent = `${row.full_name} — ${row.class_stream || "No class"}`;
            const meta = document.createElement("span");
            meta.textContent = `${row.student_reg_no} · ${row["school__name"] || ""}`;
            button.appendChild(title);
            button.appendChild(meta);
            button.addEventListener("click", () => selectStudent(row));
            searchResults.appendChild(button);
        });
    }

    function showStudentBanner(titleText, subtitleText, isError) {
        const infoDiv = document.getElementById("studentInfo");
        infoDiv.style.display = "block";
        infoDiv.innerHTML = "";
        if (isError) {
            const errSpan = document.createElement("span");
            errSpan.style.color = "#fca5a5";
            errSpan.textContent = titleText;
            infoDiv.appendChild(errSpan);
            return;
        }
        const strongEl = document.createElement("strong");
        strongEl.textContent = titleText;
        const br = document.createElement("br");
        const hintEl = document.createElement("span");
        hintEl.style.color = "#10b981";
        hintEl.textContent = subtitleText;
        infoDiv.appendChild(strongEl);
        infoDiv.appendChild(br);
        infoDiv.appendChild(hintEl);
    }

    function selectStudent(row) {
        scannedId.value = row.student_reg_no;
        resetCheckoutKey();
        selectedStudent = { name: row.full_name || "", classStream: row.class_stream || "" };
        updateConfirmChargeBanner();
        nameSearch.value = "";
        searchResults.innerHTML = "";
        showStudentBanner(
            `${row.full_name} — ${row.class_stream || "No class"}`,
            `${row.student_reg_no} · student enters their 4-digit PIN`,
            false
        );
        document.getElementById("studentPin").focus();
    }

    async function fetchStudentInfo() {
        const regNo = scannedId.value.trim();
        if (!regNo) {
            selectedStudent = { name: "", classStream: "" };
            updateConfirmChargeBanner();
            return;
        }

        const res = await fetch(`/api/student/lookup/?reg_no=${encodeURIComponent(regNo)}`);
        const data = await res.json();

        if (res.ok) {
            selectedStudent = { name: data.full_name || "", classStream: data.class_stream || "" };
            updateConfirmChargeBanner();
            const classLabel = data.class_stream ? ` — ${data.class_stream}` : "";
            showStudentBanner(
                `${data.full_name}${classLabel} (${data.school})`,
                "Code verified — student enters their 4-digit PIN",
                false
            );
        } else {
            selectedStudent = { name: "", classStream: "" };
            updateConfirmChargeBanner();
            showStudentBanner(data.error || "Student ID not found.", "", true);
        }
    }

    async function checkBalanceOnly() {
        const alertBox = document.getElementById("alertBox");
        const balanceBtn = document.getElementById("balanceBtn");
        const payload = {
            student_reg_no: scannedId.value.trim(),
            pin: document.getElementById("studentPin").value.trim()
        };

        if (!payload.student_reg_no || !payload.pin) {
            alertBox.style.display = "block";
            alertBox.className = "alert err";
            alertBox.innerText = "Scan the CanteenPay card, type the code, or pick a name, then enter the 4-digit PIN.";
            return;
        }

        balanceBtn.disabled = true;
        try {
            const res = await fetch("/api/student/balance/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            alertBox.style.display = "block";
            if (res.ok) {
                alertBox.className = "alert ok";
                alertBox.innerText = `${data.student_name}\nWallet Balance: UGX ${Number(data.wallet_balance).toLocaleString()}\nAvailable to Spend Today: UGX ${Number(data.remaining_daily_limit).toLocaleString()}`;
                document.getElementById("studentPin").value = "";
                scannedId.focus();
            } else {
                alertBox.className = "alert err";
                alertBox.innerText = data.error || "Could not verify PIN.";
            }
        } catch (err) {
            alertBox.style.display = "block";
            alertBox.className = "alert err";
            alertBox.innerText = "Network error while checking balance.";
        } finally {
            balanceBtn.disabled = false;
        }
    }

    async function processCheckout() {
        const alertBox = document.getElementById("alertBox");
        const chargeBtn = document.getElementById("chargeBtn");
        const payload = {
            student_reg_no: scannedId.value.trim(),
            amount: orderAmount.value,
            items_note: document.getElementById("itemsNote").value.trim(),
            pin: document.getElementById("studentPin").value.trim(),
            idempotency_key: pendingIdempotencyKey
        };

        if (!payload.student_reg_no || !payload.amount || !payload.pin) {
            alertBox.style.display = "block";
            alertBox.className = "alert err";
            alertBox.innerText = "Enter student code, purchase amount, and 4-digit PIN.";
            return;
        }

        chargeBtn.disabled = true;
        chargeBtn.innerText = "Processing...";
        try {
            const res = await fetch("/api/canteen/checkout/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            alertBox.style.display = "block";
            if (res.ok) {
                alertBox.className = "alert ok";
                alertBox.innerText = `APPROVED! New Balance: UGX ${Number(data.new_balance).toLocaleString()}`;
                orderAmount.value = "";
                document.getElementById("itemsNote").value = "";
                document.getElementById("studentPin").value = "";
                resetCheckoutKey();
                updateConfirmChargeBanner();
                fetchStudentInfo();
                scannedId.focus();
            } else {
                alertBox.className = "alert err";
                alertBox.innerText = data.error || "Transaction Declined";
            }
        } catch (err) {
            alertBox.style.display = "block";
            alertBox.className = "alert err";
            alertBox.innerText = "Network error. Please tap Charge again to retry safely.";
        } finally {
            chargeBtn.disabled = false;
            chargeBtn.innerText = "Charge Student Wallet";
        }
    }
</script>
</body>
</html>

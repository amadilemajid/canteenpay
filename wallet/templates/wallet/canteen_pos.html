{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CanteenPay">
    <link rel="manifest" href="{% url 'pos_manifest' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'wallet/icons/icon-192.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'wallet/icons/apple-touch-icon.png' %}">
    <title>CanteenPay | Canteen Scanner POS</title>
    <script src="{% static 'wallet/js/html5-qrcode.min.js' %}"></script>
    <style>
        /* ── Base ── */
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; margin: 0; padding: 0; }

        /* ── Staff header bar ── */
        .staff-bar {
            background: #0f172a;
            border-bottom: 2px solid #10b981;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .staff-bar .attendant { font-size: 0.85rem; color: #a7f3d0; font-weight: 700; white-space: nowrap; }
        .staff-bar .attendant span { color: #6ee7b7; }
        .staff-bar nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .staff-bar nav a {
            font-size: 0.78rem; color: #93c5fd; text-decoration: none;
            padding: 4px 9px; border: 1px solid #1e40af; border-radius: 5px;
            background: #1e3a5f; white-space: nowrap; transition: background 0.15s;
        }
        .staff-bar nav a:hover { background: #1d4ed8; color: #fff; }
        .staff-bar .logout-form button {
            font-size: 0.78rem; color: #fca5a5; background: #3f1515;
            border: 1px solid #7f1d1d; border-radius: 5px; padding: 4px 10px;
            cursor: pointer; font-weight: 700; width: auto; margin: 0;
            white-space: nowrap; transition: background 0.15s;
        }
        .staff-bar .logout-form button:hover { background: #7f1d1d; color: #fff; }
        #installPwaBtn {
            display: none; font-size: 0.78rem; color: #052e16; background: #10b981;
            border: none; border-radius: 5px; padding: 5px 10px;
            cursor: pointer; font-weight: 700; width: auto; margin: 0; white-space: nowrap;
        }
        #installPwaBtn:hover { background: #34d399; }

        /* ── Main card ── */
        .container { max-width: 460px; margin: 16px auto; background: #1f2937; padding: 20px; border-radius: 12px; }
        h2 { margin-top: 0; text-align: center; color: #10b981; }

        /* ── Camera preview ── */
        #reader {
            width: 100%; border-radius: 8px; overflow: hidden;
            background: #000; min-height: 56px;   /* collapses to status bar when no preview */
        }
        /* Hide html5-qrcode internal header/footer chrome we don't need */
        #reader img, #reader select { display: none !important; }

        /* ── Camera status bar ── */
        #cameraStatus {
            margin-top: 6px; padding: 7px 10px; border-radius: 6px;
            font-size: 0.82rem; font-weight: 600; text-align: center;
            background: #374151; color: #9ca3af;
        }
        #cameraStatus.ready  { background: #064e3b; color: #6ee7b7; }
        #cameraStatus.locked { background: #78350f; color: #fde68a; }
        #cameraStatus.error  { background: #7f1d1d; color: #fca5a5; }
        #switchCameraBtn {
            display: none; margin-top: 6px; padding: 8px 10px;
            background: #374151; color: #e5e7eb; border: 1px solid #4b5563;
            border-radius: 6px; font-size: 0.82rem; font-weight: 600;
        }
        #switchCameraBtn:hover:not(:disabled) { background: #4b5563; color: #fff; }

        /* ── Form controls ── */
        label { display: block; margin: 12px 0 4px; font-size: 0.9rem; color: #d1d5db; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #374151; color: #fff; font-size: 1.1rem; }
        input:focus { outline: 2px solid #10b981; border-color: #10b981; }

        /* ── Buttons ── */
        button { width: 100%; padding: 14px; background: #10b981; color: #fff; font-weight: 700; border: none; border-radius: 8px; font-size: 1.1rem; margin-top: 16px; cursor: pointer; transition: background 0.15s; }
        button:hover:not(:disabled) { background: #059669; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ── Clear / Next Student button ── */
        #clearBtn { display: none; background: #374151; color: #d1d5db; border: 1px solid #4b5563; font-size: 0.95rem; padding: 11px 14px; margin-top: 10px; }
        #clearBtn:hover:not(:disabled) { background: #4b5563; color: #fff; }

        /* ── Balance button ── */
        #balanceBtn { background: #3b82f6; margin-top: 10px; }
        #balanceBtn:hover:not(:disabled) { background: #2563eb; }

        /* ── Student info card ── */
        .info-card { background: #374151; padding: 12px; border-radius: 8px; margin-top: 12px; display: none; }

        /* ── Name search results ── */
        .results { margin-top: 6px; border-radius: 8px; overflow: hidden; }
        .results button { width: 100%; text-align: left; margin: 0; border-radius: 0; background: #374151; font-size: 0.95rem; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid #4b5563; margin-top: 0; }
        .results button span { display: block; color: #9ca3af; font-size: 0.8rem; font-weight: 500; }

        /* ── Alert boxes ── */
        .alert { padding: 12px; border-radius: 8px; margin-top: 14px; font-weight: 600; text-align: center; display: none; white-space: pre-line; }
        .ok  { background: #065f46; color: #a7f3d0; }
        .err { background: #7f1d1d; color: #fecaca; }

        /* ── Charge confirmation banner ── */
        .confirm-banner {
            display: none; margin-top: 14px; padding: 14px 12px;
            border-radius: 8px; background: #fef3c7; color: #92400e;
            border: 2px solid #f59e0b; font-size: 1.05rem;
            font-weight: 800; text-align: center;
        }
    </style>
</head>
<body>

<!-- ── Staff header bar ─────────────────────────────────────────────────── -->
<div class="staff-bar">
    <div class="attendant">🧑‍💼 Attendant: <span>{{ request.user.username }}</span></div>
    <nav>
        <a href="{% url 'bursar_daily_report' %}">📊 Daily Report</a>
        <a href="{% url 'daily_topup_noticeboard' %}">📋 Top-Up Board</a>
        <a href="{% url 'wallet_cards_page' %}">🪪 Wallet Cards</a>
        <button id="installPwaBtn" type="button" onclick="installPosApp()">📲 Install App</button>
    </nav>
    <form class="logout-form" method="post" action="{% url 'admin:logout' %}">
        {% csrf_token %}
        <button type="submit">⏏ Log Out</button>
    </form>
</div>

<!-- ── Main POS card ─────────────────────────────────────────────────────── -->
<div class="container">
    {% csrf_token %}
    <h2>Canteen QR Checkout</h2>

    <!-- Camera preview — Html5Qrcode renders into this div -->
    <div id="reader"></div>
    <div id="cameraStatus">🎥 Starting rear camera…</div>
    <button id="switchCameraBtn" type="button" onclick="switchCamera()">🔄 Switch Camera</button>

    <label for="nameSearch">Search by student name</label>
    <input type="text" id="nameSearch" placeholder="Type a name, then tap Full Name — Class" autocomplete="off">
    <div id="searchResults" class="results"></div>

    <label for="scannedId">CanteenPay code (scan the card or type it)</label>
    <input type="text" id="scannedId" placeholder="e.g. ARI-0042" autocomplete="off">

    <div id="studentInfo" class="info-card"></div>

    <label for="orderAmount">Purchase Amount (UGX)</label>
    <!-- inputmode="numeric" opens the numeric keypad directly on Android -->
    <input type="number" id="orderAmount" placeholder="e.g. 2500"
           min="100" step="100" inputmode="numeric" pattern="[0-9]*" autocomplete="off">

    <label for="itemsNote">Items Bought (Optional)</label>
    <input type="text" id="itemsNote" placeholder="e.g. Chapati + Soda" autocomplete="off">

    <!-- Confirmation banner — shown as soon as student + amount are known -->
    <div id="confirmChargeBanner" class="confirm-banner" role="status" aria-live="polite"></div>

    <label for="studentPin">Student 4-Digit PIN</label>
    <!-- autocomplete="new-password" stops browsers prefilling saved account passwords -->
    <input type="password" id="studentPin" maxlength="4"
           inputmode="numeric" placeholder="****" autocomplete="new-password">

    <button id="chargeBtn" type="button" onclick="processCheckout()">Charge Student Wallet</button>
    <button id="balanceBtn" type="button" onclick="checkBalanceOnly()">Check Balance Only (Requires PIN)</button>
    <button id="clearBtn"   type="button" onclick="resetForNextStudent()">✕ Clear / Next Student</button>

    <div id="alertBox" class="alert"></div>
</div>

<script>
    /* ═══════════════════════════════════════════════════════════════════════
       CSRF helper
    ═══════════════════════════════════════════════════════════════════════ */
    function getCookie(name) {
        let v = null;
        if (document.cookie) {
            for (const c of document.cookie.split(";")) {
                const t = c.trim();
                if (t.startsWith(name + "=")) { v = decodeURIComponent(t.slice(name.length + 1)); break; }
            }
        }
        if (!v && name === "csrftoken") {
            const el = document.querySelector("[name=csrfmiddlewaretoken]");
            if (el) v = el.value;
        }
        return v || "";
    }

    /* ═══════════════════════════════════════════════════════════════════════
       Sensory feedback — beep + vibration
       AudioContext requires a prior user gesture; the camera-start click
       (or any tap on the page) is sufficient to unlock it.
    ═══════════════════════════════════════════════════════════════════════ */
    function playBeep(frequency = 1046, durationSec = 0.12, volume = 0.35) {
        try {
            const ctx  = new (window.AudioContext || window.webkitAudioContext)();
            const osc  = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "square";
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(volume, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + durationSec);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + durationSec);
        } catch (_) { /* silent fail on browsers that block audio */ }
    }

    function vibrate(ms = 80) {
        try { navigator.vibrate?.(ms); } catch (_) {}
    }

    /* ═══════════════════════════════════════════════════════════════════════
       QR Scanner — Html5Qrcode (direct API, NOT Html5QrcodeScanner widget)
       This auto-starts the rear camera on page load with no extra button tap.
    ═══════════════════════════════════════════════════════════════════════ */
    const qrScanner = new Html5Qrcode("reader");
    const cameraStatus = document.getElementById("cameraStatus");
    const switchCameraBtn = document.getElementById("switchCameraBtn");
    const CAMERA_PREF_KEY = "canteenpay_preferred_camera_id";
    const SCAN_CONFIG = { fps: 10, qrbox: { width: 240, height: 240 } };

    let availableCameras = [];
    let currentCameraId = null;

    // Guard: ignore re-reads while a scan is "locked" (3-second cooldown)
    let scanLocked = false;

    function getActiveVideoTrack() {
        const video = document.querySelector("#reader video");
        const stream = video && video.srcObject;
        const tracks = stream && typeof stream.getVideoTracks === "function"
            ? stream.getVideoTracks()
            : [];
        return tracks[0] || null;
    }

    function readyStatusText() {
        const track = getActiveVideoTrack();
        const label = (track && track.label ? track.label : "").trim();
        return label
            ? `✅ Ready (${label}) — hold card in front of camera`
            : "✅ Ready — hold card in front of camera";
    }

    function onScanSuccess(decodedText) {
        if (scanLocked) return;          // drop all repeat reads of same card
        scanLocked = true;

        // Fill the CanteenPay code field and trigger student lookup
        scannedId.value = decodedText.trim();
        resetCheckoutKey();
        fetchStudentInfo();

        // ── Sensory confirmation ─────────────────────────────────────────
        playBeep(1046, 0.12, 0.35);      // crisp single beep (C6)
        vibrate(80);                     // 80 ms pulse on Android

        // ── Pause scanner for 3 s — same card cannot re-fire ────────────
        cameraStatus.className = "locked";
        cameraStatus.textContent = "🔒 Scan locked for 3 s — enter amount & PIN";
        qrScanner.pause(true);           // true = pause video track too (saves CPU)
        setTimeout(() => {
            if (!scanLocked) return;     // reset() was called first — don't resume
            qrScanner.resume();
            scanLocked = false;
            cameraStatus.className = "ready";
            cameraStatus.textContent = readyStatusText();
        }, 3000);
    }

    function onScanError() { /* frame-miss noise — intentionally silent */ }

    async function refreshCameraList() {
        try {
            availableCameras = await Html5Qrcode.getCameras();
        } catch (_) {
            availableCameras = [];
        }
        const track = getActiveVideoTrack();
        const settings = track && typeof track.getSettings === "function" ? track.getSettings() : {};
        if (settings.deviceId) {
            currentCameraId = settings.deviceId;
        }
        if (availableCameras.length > 1) {
            switchCameraBtn.style.display = "block";
            const idx = availableCameras.findIndex(c => c.id === currentCameraId);
            const labelNum = idx >= 0 ? ` (${idx + 1}/${availableCameras.length})` : "";
            switchCameraBtn.textContent = `🔄 Switch Camera${labelNum}`;
        } else {
            switchCameraBtn.style.display = "none";
        }
    }

    async function onCameraStarted(explicitCameraId = null) {
        if (explicitCameraId) {
            currentCameraId = explicitCameraId;
        }
        await refreshCameraList();
        cameraStatus.className = "ready";
        cameraStatus.textContent = readyStatusText();
        // Warm up AudioContext so the first scan beep fires without delay
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            ctx.resume();
        } catch (_) {}
    }

    function pickBestRearCamera(cameras) {
        const isFront = c => /front|user|selfie|facetime/i.test(c.label || "");
        const isRear  = c => /back|rear|environment/i.test(c.label || "");
        return (
            cameras.find(c => isRear(c) && !isFront(c))
            || cameras.find(c => !isFront(c))
            || cameras[0]
        );
    }

    async function startRearCamera() {
        let savedId = null;
        try { savedId = localStorage.getItem(CAMERA_PREF_KEY); } catch (_) {}

        // 1. If user explicitly chose a camera earlier and it still exists, use it
        if (savedId) {
            try {
                const cams = await Html5Qrcode.getCameras();
                if (cams.some(c => c.id === savedId)) {
                    await qrScanner.start(savedId, SCAN_CONFIG, onScanSuccess, onScanError);
                    await onCameraStarted(savedId);
                    return;
                }
            } catch (_) {
                try { localStorage.removeItem(CAMERA_PREF_KEY); } catch (_) {}
            }
        }

        // 2. Force exact rear camera — unlike soft "environment", exact refuses
        //    to silently fall back to the front selfie camera on phones.
        try {
            await qrScanner.start({ facingMode: { exact: "environment" } }, SCAN_CONFIG, onScanSuccess, onScanError);
            await onCameraStarted();
            return;
        } catch (exactErr) {
            console.warn("exact environment camera unavailable, falling back:", exactErr);
        }

        // 3. Fallback (desktop webcams or devices that reject exact constraints)
        try {
            const cameras = await Html5Qrcode.getCameras();
            if (!cameras || cameras.length === 0) {
                setCameraError("No camera found on this device.");
                return;
            }
            const chosen = pickBestRearCamera(cameras);
            await qrScanner.start(chosen.id, SCAN_CONFIG, onScanSuccess, onScanError);
            await onCameraStarted(chosen.id);
        } catch (fallbackErr) {
            const errText = String(fallbackErr);
            const msg = errText.includes("Permission")
                ? "Camera permission denied — allow camera in browser settings."
                : `Camera error: ${errText.slice(0, 80)}`;
            setCameraError(msg);
        }
    }

    async function switchCamera() {
        if (availableCameras.length < 2) return;
        switchCameraBtn.disabled = true;
        try {
            const currentIdx = availableCameras.findIndex(c => c.id === currentCameraId);
            const nextCam = availableCameras[(currentIdx + 1) % availableCameras.length];
            scanLocked = false;
            try { await qrScanner.stop(); } catch (_) {}
            await qrScanner.start(nextCam.id, SCAN_CONFIG, onScanSuccess, onScanError);
            try { localStorage.setItem(CAMERA_PREF_KEY, nextCam.id); } catch (_) {}
            await onCameraStarted(nextCam.id);
        } catch (err) {
            setCameraError(`Could not switch camera: ${String(err).slice(0, 80)}`);
        } finally {
            switchCameraBtn.disabled = false;
        }
    }

    function setCameraError(msg) {
        cameraStatus.className = "error";
        cameraStatus.textContent = "❌ " + msg;
    }

    // Auto-start on page load — attendant just opens /pos/ and camera is ready
    document.addEventListener("DOMContentLoaded", startRearCamera);

    /* ═══════════════════════════════════════════════════════════════════════
       Idempotency key — fresh UUID per transaction
    ═══════════════════════════════════════════════════════════════════════ */
    function generateIdempotencyKey() {
        return window.crypto?.randomUUID?.() || `pos-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }
    let pendingIdempotencyKey = generateIdempotencyKey();
    function resetCheckoutKey() { pendingIdempotencyKey = generateIdempotencyKey(); }

    /* ═══════════════════════════════════════════════════════════════════════
       DOM refs & state
    ═══════════════════════════════════════════════════════════════════════ */
    const nameSearch          = document.getElementById("nameSearch");
    const searchResults       = document.getElementById("searchResults");
    const scannedId           = document.getElementById("scannedId");
    const orderAmount         = document.getElementById("orderAmount");
    const confirmChargeBanner = document.getElementById("confirmChargeBanner");
    const alertBox            = document.getElementById("alertBox");
    const clearBtn            = document.getElementById("clearBtn");

    let selectedStudent = { name: "", classStream: "" };

    // Auto-focus code field on load for USB/Bluetooth scanner keyboards
    scannedId.focus();

    /* ═══════════════════════════════════════════════════════════════════════
       Confirm-charge banner
    ═══════════════════════════════════════════════════════════════════════ */
    function updateConfirmChargeBanner() {
        const amountVal = Number(orderAmount.value);
        if (selectedStudent.name && amountVal > 0) {
            const cls = selectedStudent.classStream ? ` (${selectedStudent.classStream})` : "";
            confirmChargeBanner.textContent =
                `⚠ Confirm Charge: UGX ${amountVal.toLocaleString()} to ${selectedStudent.name}${cls}`;
            confirmChargeBanner.style.display = "block";
        } else {
            confirmChargeBanner.textContent = "";
            confirmChargeBanner.style.display = "none";
        }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       Input listeners
    ═══════════════════════════════════════════════════════════════════════ */
    scannedId.addEventListener("input", () => {
        resetCheckoutKey();
        selectedStudent = { name: "", classStream: "" };
        updateConfirmChargeBanner();
    });
    scannedId.addEventListener("change", fetchStudentInfo);
    scannedId.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); fetchStudentInfo(); }
    });
    orderAmount.addEventListener("input", () => {
        resetCheckoutKey();
        updateConfirmChargeBanner();
    });

    /* ═══════════════════════════════════════════════════════════════════════
       Name search
    ═══════════════════════════════════════════════════════════════════════ */
    let searchTimer = null;
    nameSearch.addEventListener("input", () => {
        clearTimeout(searchTimer);
        const q = nameSearch.value.trim();
        if (q.length < 2) { searchResults.innerHTML = ""; return; }
        searchTimer = setTimeout(() => searchStudents(q), 250);
    });

    async function searchStudents(query) {
        const res = await fetch(`/api/pos/students/search/?q=${encodeURIComponent(query)}`);
        searchResults.innerHTML = "";
        if (!res.ok) return;
        const data = await res.json();
        (data.results || []).forEach((row) => {
            const btn = document.createElement("button");
            btn.type = "button";
            const title = document.createElement("strong");
            title.textContent = `${row.full_name} — ${row.class_stream || "No class"}`;
            const meta = document.createElement("span");
            meta.textContent = `${row.student_reg_no} · ${row["school__name"] || ""}`;
            btn.appendChild(title);
            btn.appendChild(meta);
            btn.addEventListener("click", () => selectStudent(row));
            searchResults.appendChild(btn);
        });
    }

    function selectStudent(row) {
        scannedId.value = row.student_reg_no;
        resetCheckoutKey();
        selectedStudent = { name: row.full_name || "", classStream: row.class_stream || "" };
        updateConfirmChargeBanner();
        nameSearch.value = "";
        searchResults.innerHTML = "";
        showStudentBanner(
            `${row.full_name} — ${row.class_stream || "No class"}`,
            `${row.student_reg_no} · student enters their 4-digit PIN`,
            false
        );
        document.getElementById("studentPin").focus();
    }

    /* ═══════════════════════════════════════════════════════════════════════
       Student info banner
    ═══════════════════════════════════════════════════════════════════════ */
    function showStudentBanner(titleText, subtitleText, isError) {
        const infoDiv = document.getElementById("studentInfo");
        infoDiv.style.display = "block";
        infoDiv.innerHTML = "";
        if (isError) {
            const s = document.createElement("span");
            s.style.color = "#fca5a5";
            s.textContent = titleText;
            infoDiv.appendChild(s);
            return;
        }
        const strong = document.createElement("strong");
        strong.textContent = titleText;
        const hint = document.createElement("span");
        hint.style.cssText = "display:block; color:#10b981; margin-top:4px; font-size:0.88rem;";
        hint.textContent = subtitleText;
        infoDiv.appendChild(strong);
        infoDiv.appendChild(hint);
    }

    async function fetchStudentInfo() {
        const regNo = scannedId.value.trim();
        if (!regNo) {
            selectedStudent = { name: "", classStream: "" };
            updateConfirmChargeBanner();
            return;
        }
        const res  = await fetch(`/api/student/lookup/?reg_no=${encodeURIComponent(regNo)}`);
        const data = await res.json();
        if (res.ok) {
            selectedStudent = { name: data.full_name || "", classStream: data.class_stream || "" };
            updateConfirmChargeBanner();
            const cls = data.class_stream ? ` — ${data.class_stream}` : "";
            showStudentBanner(
                `${data.full_name}${cls} (${data.school})`,
                "Code verified — student enters their 4-digit PIN",
                false
            );
        } else {
            selectedStudent = { name: "", classStream: "" };
            updateConfirmChargeBanner();
            showStudentBanner(data.error || "Student ID not found.", "", true);
        }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       Reset / Next Student
       Also resumes the scanner so it's immediately ready for the next card.
    ═══════════════════════════════════════════════════════════════════════ */
    function resetForNextStudent() {
        scannedId.value = "";
        orderAmount.value = "";
        document.getElementById("itemsNote").value = "";
        document.getElementById("studentPin").value = "";
        document.getElementById("studentInfo").style.display = "none";
        alertBox.style.display = "none";
        clearBtn.style.display = "none";
        selectedStudent = { name: "", classStream: "" };
        updateConfirmChargeBanner();
        resetCheckoutKey();
        nameSearch.value = "";
        searchResults.innerHTML = "";

        // Resume scanner if it was paused mid-cooldown
        if (scanLocked) {
            scanLocked = false;
            try { qrScanner.resume(); } catch (_) {}
        }
        cameraStatus.className = "ready";
        cameraStatus.textContent = readyStatusText();
        scannedId.focus();
    }

    /* ═══════════════════════════════════════════════════════════════════════
       Balance check
    ═══════════════════════════════════════════════════════════════════════ */
    async function checkBalanceOnly() {
        const balanceBtn = document.getElementById("balanceBtn");
        const payload = {
            student_reg_no: scannedId.value.trim(),
            pin: document.getElementById("studentPin").value.trim()
        };
        if (!payload.student_reg_no || !payload.pin) {
            showAlert("err", "Scan the CanteenPay card, type the code, or pick a name, then enter the 4-digit PIN.");
            return;
        }
        balanceBtn.disabled = true;
        try {
            const res  = await fetch("/api/student/balance/", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                showAlert("ok",
                    `${data.student_name}\n` +
                    `Wallet Balance: UGX ${Number(data.wallet_balance).toLocaleString()}\n` +
                    `Available to Spend Today: UGX ${Number(data.remaining_daily_limit).toLocaleString()}`
                );
                document.getElementById("studentPin").value = "";
                clearBtn.style.display = "block";
            } else {
                showAlert("err", data.error || "Could not verify PIN.");
            }
        } catch {
            showAlert("err", "Network error while checking balance.");
        } finally {
            balanceBtn.disabled = false;
        }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       Checkout
    ═══════════════════════════════════════════════════════════════════════ */
    async function processCheckout() {
        const chargeBtn = document.getElementById("chargeBtn");
        const payload = {
            student_reg_no:  scannedId.value.trim(),
            amount:          orderAmount.value,
            items_note:      document.getElementById("itemsNote").value.trim(),
            pin:             document.getElementById("studentPin").value.trim(),
            idempotency_key: pendingIdempotencyKey
        };
        if (!payload.student_reg_no || !payload.amount || !payload.pin) {
            showAlert("err", "Enter student code, purchase amount, and 4-digit PIN.");
            return;
        }
        chargeBtn.disabled = true;
        chargeBtn.innerText = "Processing…";
        try {
            const res  = await fetch("/api/canteen/checkout/", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                // Double beep = APPROVED (distinct from single scan beep)
                playBeep(1319, 0.08, 0.3);  // E6
                setTimeout(() => playBeep(1568, 0.1, 0.3), 110); // G6
                vibrate([60, 40, 60]);

                showAlert("ok", `✅ APPROVED!  New Balance: UGX ${Number(data.new_balance).toLocaleString()}`);
                orderAmount.value = "";
                document.getElementById("itemsNote").value = "";
                document.getElementById("studentPin").value = "";
                resetCheckoutKey();
                updateConfirmChargeBanner();
                fetchStudentInfo();     // refresh student card to reflect new balance hint
                clearBtn.style.display = "block";
            } else {
                let errMsg = data.error || "Transaction Declined";
                if (data.remaining_daily_limit !== undefined) {
                    errMsg += `  Remaining today: UGX ${Number(data.remaining_daily_limit).toLocaleString()}.`;
                } else if (data.current_balance !== undefined) {
                    errMsg += `  Current balance: UGX ${Number(data.current_balance).toLocaleString()}.`;
                }
                showAlert("err", errMsg);
            }
        } catch {
            showAlert("err", "Network error. Please tap Charge again to retry safely.");
        } finally {
            chargeBtn.disabled = false;
            chargeBtn.innerText = "Charge Student Wallet";
        }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       Alert helper
    ═══════════════════════════════════════════════════════════════════════ */
    function showAlert(type, msg) {
        alertBox.style.display = "block";
        alertBox.className = `alert ${type}`;
        alertBox.innerText = msg;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       PWA Registration & Install Prompt
    ═══════════════════════════════════════════════════════════════════════ */
    let deferredInstallPrompt = null;
    const installPwaBtn = document.getElementById("installPwaBtn");

    window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        if (!window.matchMedia("(display-mode: standalone)").matches) {
            installPwaBtn.style.display = "inline-block";
        }
    });

    window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        installPwaBtn.style.display = "none";
    });

    async function installPosApp() {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installPwaBtn.style.display = "none";
    }

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker
                .register("{% url 'pos_service_worker' %}", { scope: "/" })
                .catch(() => {});
        });
    }
</script>
</body>
</html>

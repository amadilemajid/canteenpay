{% extends "wallet/_auth_base.html" %}
{% block title %}Change Password | CanteenPay{% endblock %}
{% block content %}
<h1>Change Your Password</h1>
<p>Keep your canteen attendant or bursar account secure.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="submit-btn">Update Password ✓</button>
</form>
<div class="links">
    <a href="{% url 'canteen_pos_page' %}">← Back to POS</a>
</div>
{% endblock %}

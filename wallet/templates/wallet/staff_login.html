<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanteenPay | Staff Sign In</title>
    <style>
        :root, [data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;
            --border: #334155; --input-bg: #0f172a; --input-txt: #f8fafc;
        }
        [data-theme="light"] {
            --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280;
            --border: #d1d5db; --input-bg: #f9fafb; --input-txt: #111827;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; transition: background 0.2s, color 0.2s;
        }
        .login-card {
            width: 100%; max-width: 390px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 28px 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        }
        .brand {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 18px;
        }
        .brand-logo { font-size: 1.35rem; font-weight: 800; color: #10b981; letter-spacing: -0.02em; }
        .theme-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text);
            border-radius: 8px; padding: 5px 10px; font-size: 0.85rem; cursor: pointer;
        }
        h1 { margin: 0 0 6px; font-size: 1.25rem; }
        .sub { margin: 0 0 18px; color: var(--muted); font-size: 0.88rem; }
        label { display: block; font-size: 0.88rem; font-weight: 600; margin: 12px 0 5px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--input-bg);
            color: var(--input-txt); font-size: 1rem;
        }
        input:focus { outline: 2px solid #10b981; border-color: #10b981; }
        .submit-btn {
            width: 100%; padding: 13px; margin-top: 20px;
            background: #10b981; color: #052e16; font-weight: 800;
            border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
        }
        .submit-btn:hover { background: #34d399; }
        .err-box {
            background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444;
            border-radius: 8px; padding: 10px 12px; font-size: 0.88rem;
            font-weight: 600; margin-bottom: 14px;
        }
        .links {
            margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; font-size: 0.84rem;
        }
        .links a { color: #10b981; text-decoration: none; font-weight: 600; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-logo">💳 CanteenPay POS</div>
            <button type="button" class="theme-btn" id="themeToggle" onclick="toggleTheme()">☀️ Light</button>
        </div>
        <h1>Staff &amp; Bursar Sign In</h1>
        <p class="sub">Sign in with your canteen attendant or school bursar account.</p>

        {% if form.errors %}
        <div class="err-box">Invalid username or password. Please check your credentials and try again.</div>
        {% endif %}

        <form method="post" action="{% url 'staff_login' %}">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" autofocus required autocomplete="username" placeholder="e.g. canteen_staff">

            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required autocomplete="current-password" placeholder="••••••••">

            <button type="submit" class="submit-btn">Sign In →</button>
        </form>

        <div class="links">
            <a href="/">← Parent Top-Up</a>
            <a href="/admin/">Django Admin</a>
        </div>
    </div>
    <script>
        const THEME_KEY = "canteenpay_theme";
        function applyTheme(dark) {
            document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            document.getElementById("themeToggle").textContent = dark ? "☀️ Light" : "🌙 Dark";
            try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (_) {}
        }
        function toggleTheme() {
            applyTheme(document.documentElement.getAttribute("data-theme") !== "dark");
        }
        (function () {
            let saved = null;
            try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
            applyTheme(saved !== "light");
        })();
    </script>
</body>
</html>
